[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "proxy-pipeline-orchestrator"
version = "0.1.0"
description = "CLI for Terraform + Ansible proxy pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer[all]>=0.12.3",
  "PyYAML>=6.0.1",
  "qrcode[png]>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4.0"]
telegram = ["python-telegram-bot>=21.0"]

[project.scripts]
pipelinectl = "pipelinectl.cli:main"
pipelinebot = "pipelinectl.bot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pipelinectl"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
