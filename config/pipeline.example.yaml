# Copy to config/pipeline.yaml and adjust (config/pipeline.yaml is gitignored).
# Secrets: use environment variables (see docs/PIPELINE.md) or a local secrets file — never commit tokens.

version: 1

paths:
  terraform_dir: terraform
  ansible_dir: ansible
  state_dir: state

providers:
  cherry:
    enabled: true
  yandex:
    # When false, Terraform skips the bridge module (no Yandex credentials required).
    enabled: false
    cloud_id: ""
    folder_id: ""
    zone: ru-central1-a
    # Required when enabled: subnet with NAT route for the VM public IP
    subnet_id: ""
    create_vpc: false
    instance_name: proxy-bridge
  timeweb:
    # RU bridge on Timeweb Cloud (cheaper than Yandex). Auth: export TWC_TOKEN
    # (token must allow "delete services via API without a Telegram code").
    # The actual toggle lives in terraform.tfvars (enable_timeweb_bridge etc.);
    # this block documents the intended setup.
    enabled: false
    configurator_location: ru-1 # ru-1=СПб, ru-2=Москва, de-1, kz-1
    availability_zone: "" # spb-1/msk-1/...; empty = Timeweb chooses

ssh:
  exit_user: root
  exit_private_key_path: ~/.ssh/proxy_pipeline
  bridge_user: ubuntu
  bridge_private_key_path: ~/.ssh/proxy_pipeline

panel:
  port: "2053"
  user: admin
  # Set via env PROXY_PIPELINE_PANEL_PASS or pipeline.yaml (not recommended in git)
  pass: ""
  path: /secretpanel

xray:
  reality_sni: www.microsoft.com
  reality_port: 443
  ss_port: 8388
  ss_method: 2022-blake3-aes-128-gcm
  chain_port: 8443

alerts:
  telegram_bot_token: ""
  telegram_chat_id: ""
  # Channels that reach a phone in Russia WITHOUT the VPN (the chain being down is the point).
  # E-mail: any SMTP with an app password (smtp.yandex.ru:465 / smtp.gmail.com:465 / :587 STARTTLS).
  email_to: ""
  email_from: ""
  smtp_host: smtp.yandex.ru
  smtp_port: 465
  smtp_user: ""
  smtp_pass: ""            # or env PROXY_PIPELINE_SMTP_PASS
  # SMS via sms.ru (optional): api_id from https://sms.ru/?panel=api
  sms_ru_api_id: ""        # or env PROXY_PIPELINE_SMSRU_API_ID
  sms_to: ""               # +7XXXXXXXXXX

# Self-healing watchdog (pipelinectl watchdog, timer proxy-pipeline-alert every 5 min):
# chain DOWN because of the Exit -> `rotate exit --yes` in the same region (all gates + re-rolls),
# then each fallback region; alert only if every attempt failed. Rails against loops:
watchdog:
  auto_rotate: true
  cooldown_hours: 2        # min time between automatic rotations
  max_per_day: 3           # hard cap per 24 h, then alert only
  fallback_regions: []     # e.g. ["LT-Siauliai", "DE-Frankfurt"] tried after the same region
  notify_on_success: true  # e-mail/SMS "auto-rotated, new Exit X" (QR unchanged)

# Optional: Telegram control plane (install orchestrator with pip install -e ".[telegram]").
telegram:
  bot_token: "" # or env TELEGRAM_BOT_TOKEN
  allowed_user_ids: [] # Telegram user ids allowed to use /status, /validate, …
  notify_chat_id: "" # target for pipelinectl notify and future watchdog alerts