---
# Standalone: (re)apply the Exit firewall without touching inbounds (the exit role is not
# idempotent). `pipelinectl configure --exit-firewall-only`.
- name: Exit firewall
  hosts: exit
  gather_facts: false
  vars:
    pipeline_state_dir: "{{ playbook_dir }}/../../state"
  roles:
    - role: exit_firewall
