---
- name: Require panel password
  ansible.builtin.fail:
    msg: "Set panel_pass (extra var or vault). Refuse empty password."
  when: panel_pass is not defined or (panel_pass | string | length) == 0

- name: Require reality_sni (must come from probe-targets, not defaults)
  ansible.builtin.fail:
    msg: >
      reality_sni is empty. Run 'pipelinectl probe-targets' before 'configure'.
      Configure reads state/reality_target.json and passes reality_sni + reality_dest
      as extra vars. Using a hardcoded default is intentionally forbidden.
  when: reality_sni is not defined or (reality_sni | string | trim | length) == 0

- name: Require reality_dest (must come from probe-targets)
  ansible.builtin.fail:
    msg: >
      reality_dest is empty. Run 'pipelinectl probe-targets' before 'configure'.
  when: reality_dest is not defined or (reality_dest | string | trim | length) == 0

- name: Wait for SSH
  ansible.builtin.wait_for_connection:
    timeout: 300

- name: Wait for cloud-init marker
  ansible.builtin.stat:
    path: /opt/proxy-pipeline/.status
  register: marker
  until: marker.stat.exists | default(false)
  retries: 60
  delay: 5

- name: Normalize panel path input
  ansible.builtin.set_fact:
    panel_path_clean: >-
      {{ (panel_path | default('/') | string | trim)
         | regex_replace('^/+', '')
         | regex_replace('/+$', '') }}

- name: Build panel path variants
  ansible.builtin.set_fact:
    panel_request_prefix: >-
      {{ '' if panel_path_clean == '' else '/' ~ panel_path_clean }}
    panel_web_base_path: >-
      {{ '/' if panel_path_clean == '' else '/' ~ panel_path_clean ~ '/' }}
    panel_ui_path: >-
      {{ '/' if panel_path_clean == '' else '/' ~ panel_path_clean ~ '/' }}

- name: Install WORLD SSH helper
  ansible.builtin.file:
    path: "{{ world_remote_helper | dirname }}"
    state: directory
    mode: "0755"

- name: Copy WORLD SSH helper
  ansible.builtin.copy:
    src: world_remote.py
    dest: "{{ world_remote_helper }}"
    mode: "0644"

- name: Discover the bundled Xray binary
  ansible.builtin.find:
    paths: /usr/local/x-ui/bin
    patterns: xray-linux-*
    file_type: file
  register: world_binaries

- name: Require one bundled Xray binary (or an explicit override)
  ansible.builtin.assert:
    that: world_xray_binary != '' or world_binaries.matched == 1
    fail_msg: "Cannot uniquely identify the installed WORLD Xray; set world_xray_binary explicitly"

- name: Select installed WORLD Xray
  ansible.builtin.set_fact:
    world_binary: "{{ world_xray_binary or world_binaries.files[0].path }}"

- name: Verify the pinned WORLD release
  ansible.builtin.include_tasks: release.yml

# Bootstrap is explicit and only permitted on an empty local SQLite panel. Existing
# panels must already authenticate with the configured credentials/path: never reset
# them, or restart x-ui, just because a login failed.
- name: Bootstrap a fresh panel only when requested
  when: panel_bootstrap | bool
  block:
    - name: Verify empty SQLite panel and save a consistent database backup
      ansible.builtin.command:
        argv: [python3, "{{ world_remote_helper }}"]
        stdin: "{{ {'action': 'bootstrap', 'binary': world_binary, 'database': world_database} | to_json }}"
      register: world_bootstrap_snapshot
      changed_when: true

    - name: Configure fresh panel credentials and path
      ansible.builtin.command:
        argv:
          - /usr/local/x-ui/x-ui
          - setting
          - -username
          - "{{ panel_user }}"
          - -password
          - "{{ panel_pass }}"
          - -port
          - "{{ panel_port }}"
          - -webBasePath
          - "{{ panel_web_base_path }}"
      no_log: true

    - name: Start the bootstrapped panel
      ansible.builtin.systemd:
        name: x-ui
        state: restarted

- name: Wait for the local panel listener
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ panel_port | int }}"
    timeout: 120

- name: Configure WORLD inbounds transaction
  ansible.builtin.include_tasks: transaction.yml
