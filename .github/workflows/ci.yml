name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform fmt + validate
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform fmt -check
          terraform validate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch pinned Xray for local routing regression tests
        env:
          XRAY_TEST_VERSION: "25.10.15"
          XRAY_TEST_SHA256: df22ad60c1251c9fb63d7f85b3677872edf61c6715eba64b06adbfec658f4938
        run: |
          mkdir -p "$RUNNER_TEMP/xray-test"
          archive="$RUNNER_TEMP/xray-test/Xray-linux-64.zip"
          curl --fail --location --retry 2 --max-time 60 \
            "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_TEST_VERSION}/Xray-linux-64.zip" \
            --output "$archive"
          printf '%s  %s\n' "$XRAY_TEST_SHA256" "$archive" | sha256sum --check
          unzip -q "$archive" xray geoip.dat geosite.dat -d "$RUNNER_TEMP/xray-test"
          chmod +x "$RUNNER_TEMP/xray-test/xray"
          printf 'XRAY_TEST_BINARY=%s\n' "$RUNNER_TEMP/xray-test/xray" >> "$GITHUB_ENV"

      # The reverse-proxy tests start their own nginx on loopback; the packaged service is not used.
      - name: nginx for the HTTPS entry tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          sudo systemctl stop nginx
          printf 'NGINX_TEST_BINARY=%s\n' /usr/sbin/nginx >> "$GITHUB_ENV"

      - name: Install orchestrator + test
        run: |
          pip install -e "./orchestrator[dev]"
          pytest -q orchestrator/tests

      - name: Ruff
        run: |
          pip install ruff
          ruff check orchestrator/src orchestrator/tests ansible/roles/bridge_xray_relay/files ansible/roles/exit_xui_reality/files ansible/roles/exit_firewall/files

      - name: Ansible syntax
        run: |
          pip install ansible
          printf '%s\n' \
            '[exit]' \
            'exit_node ansible_host=127.0.0.1 ansible_connection=local' \
            '' \
            '[bridge]' \
            'bridge_node ansible_host=127.0.0.1 ansible_connection=local' > /tmp/inv.ini
          ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook --syntax-check -i /tmp/inv.ini ansible/playbooks/exit_only.yml
          ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook --syntax-check -i /tmp/inv.ini ansible/playbooks/site.yml
          ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook --syntax-check -i /tmp/inv.ini ansible/playbooks/exit_firewall.yml
