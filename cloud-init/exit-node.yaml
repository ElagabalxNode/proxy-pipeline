#cloud-config
# ============================================
# Exit Node — Cloud Init
# Автоматически ставит: Docker, 3X-UI, BBR, fail2ban
# ============================================

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - jq
  - unzip
  - fail2ban
  - ufw
  - ca-certificates
  - gnupg

write_files:
  # BBR конфигурация
  - path: /etc/sysctl.d/99-bbr.conf
    content: |
      net.core.default_qdisc=fq
      net.ipv4.tcp_congestion_control=bbr
      net.ipv4.tcp_fastopen=3
      net.ipv4.tcp_slow_start_after_idle=0
      net.core.rmem_max=16777216
      net.core.wmem_max=16777216
      net.ipv4.tcp_rmem=4096 87380 16777216
      net.ipv4.tcp_wmem=4096 65536 16777216
      net.ipv4.ip_forward=1

  # Fail2ban для SSH
  - path: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      logpath = /var/log/auth.log
      maxretry = 3
      bantime = 3600

  # Маркер завершения установки
  - path: /opt/proxy-pipeline/setup-status.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      echo "cloud-init-complete" > /opt/proxy-pipeline/.status
      date >> /opt/proxy-pipeline/.status

runcmd:
  # Применить BBR
  - sysctl -p /etc/sysctl.d/99-bbr.conf

  # Создать рабочую директорию
  - mkdir -p /opt/proxy-pipeline

  # Установить Docker
  - curl -fsSL https://get.docker.com | sh

  # Установить 3X-UI (неинтерактивно)
  - |
    echo "y" | bash <(curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh)

  # Дождаться запуска 3X-UI и сменить дефолтные настройки
  - sleep 10

  # Настроить порт и credentials через CLI 3X-UI
  - x-ui setting -port ${panel_port}
  - x-ui setting -username ${panel_user} -password ${panel_pass}
  - x-ui setting -webBasePath ${panel_path}
  - x-ui restart

  # Запустить fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Маркер готовности
  - /opt/proxy-pipeline/setup-status.sh
